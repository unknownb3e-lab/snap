<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapTube - تنزيل الفيديوهات والأغاني</title>
    <meta name="description" content="تنزيل الفيديوهات والأغاني بسهولة">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnapTube">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <div>
                    <h1>SnapTube</h1>
                    <div class="brand-sub">تحميل فيديو وصوت بضغطة</div>
                </div>
            </div>
        </header>

        <main class="app-main">
            <section class="hero">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="الصق رابط الفيديو هنا..."
                        class="search-input"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >
                    <button id="pasteBtn" class="search-action" title="لصق">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                    </button>
                </div>
            </section>

            <section class="preview" id="preview" style="display: none;">
                <div class="preview-card">
                    <div class="preview-thumb" id="previewThumb">
                        <div class="preview-play">▶</div>
                    </div>
                    <div class="preview-body">
                        <h2 class="preview-title" id="previewTitle">عنوان الفيديو</h2>
                        <p class="preview-meta" id="previewMeta">الناشر • المدة</p>
                    </div>
                </div>

                <div class="options" id="optionsSection">
                    <div class="section-label">
                        <span>اختر الصيغة</span>
                    </div>
                    <div class="format-tabs" id="formatTabs">
                        <button class="format-tab active" data-format="mp4">MP4</button>
                        <button class="format-tab" data-format="mp3">MP3</button>
                    </div>

                    <div class="section-label" style="margin-top: 18px;">
                        <span>اختر الجودة</span>
                        <span class="badge" id="qualityHint">تلقائي</span>
                    </div>
                    <div class="quality-list" id="qualityList">
                        <div class="quality-item">
                            <div>
                                <div class="quality-name">جاري تحميل الدقات...</div>
                            </div>
                        </div>
                    </div>

                    <button id="downloadBtn" class="download-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>تنزيل الآن</span>
                    </button>
                </div>
            </section>

            <section class="history-section">
                <div class="section-header">
                    <h2>آخر التنزيلات</h2>
                    <button id="clearHistory" class="ghost-btn" style="display: none;">مسح</button>
                </div>
                <div id="downloadHistory" class="history-list">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>لا توجد تنزيلات بعد</p>
                        <p class="empty-hint">الصق رابط أي فيديو للبدء</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>SnapTube Clone • للاستخدام الشخصي فقط</p>
        </footer>
    </div>

    <div id="toast" class="toast" style="display: none;"></div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
